name: esptv_player
description: "A new Flutter project."
publish_to: 'none'
version: 2.2.53+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  flutter_riverpod: ^3.4.3
  go_router: ^18.0.1
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.6
  xml: ^7.0.1
  uuid: ^4.6.0
  http: ^1.6.0
  supabase_flutter: ^2.17.2
  postgres: ^3.5.12
  window_manager: ^0.5.2
  google_fonts: ^8.2.1
  wireguard_flutter: ^0.1.3
  cryptography: ^2.9.0
  package_info_plus: ^10.2.1
  open_filex: ^4.7.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  isar_generator: ^3.1.0+1
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/tvlogos_paths.json
    - assets/channel_categories.json
    - assets/images/
    - assets/icon.jpg

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    icon_path: "assets/icon.jpg"
  image_path: "assets/icon.jpg"